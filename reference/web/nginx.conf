# Docker's DNS, re-resolved so a recreated api or minio container is found again.
resolver 127.0.0.11 valid=10s ipv6=off;

# care_fe and the ABDM plug on one origin, with CARE's API and file storage behind it.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 50m;

  include mime.types;
  types {
    text/javascript js mjs;
  }

  set $api http://api:9000;
  set $minio http://minio:9000;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Every plug's built files. A plug's own care_fe routes sit at the top level (/abdm/...), so
  # keeping its files under /plugs/ leaves those paths to the SPA fallback below.
  location /plugs/ {
    alias /usr/share/nginx/plugs/;
  }

  # Presigned file URLs are signed for this origin (BUCKET_EXTERNAL_ENDPOINT), so MinIO must see the same host.
  location ~ ^/(patient-bucket|facility-bucket)/ {
    proxy_pass $minio;
    proxy_set_header Host $http_host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# The public tunnel (m2 profile) reaches only the ABDM callback routes.
server {
  listen 8080;

  set $api http://api:9000;

  location /api/abdm/ {
    proxy_pass $api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    return 404;
  }
}
