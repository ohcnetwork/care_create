# CARE with the care-abdm plug, built from source on every `up --build`: care and care_fe from
# their latest develop, and care-abdm at a94088c, the latest commit on its main.
# Usage is in README.md next to this file.
name: care-reference

x-care-env: &care-env
  DJANGO_SETTINGS_MODULE: config.settings.deployment
  # Debug is on so failed API calls return their tracebacks. care's demo data loader also needs it.
  DJANGO_DEBUG: "True"
  DJANGO_SECRET_KEY: care-reference
  DJANGO_ADMIN_URL: admin
  DJANGO_SECURE_HSTS_PRELOAD: "False"
  DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
  DJANGO_SECURE_SSL_REDIRECT: "False"
  DJANGO_SECURE_CONTENT_TYPE_NOSNIFF: "False"
  # care's wait_for_db.sh reads the POSTGRES_* values; Django reads DATABASE_URL.
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: care
  DATABASE_URL: postgres://postgres:postgres@db:5432/care
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  BUCKET_REGION: ap-south-1
  BUCKET_KEY: minioadmin
  BUCKET_SECRET: minioadmin
  BUCKET_ENDPOINT: http://minio:9000
  BUCKET_EXTERNAL_ENDPOINT: http://localhost:${REFERENCE_PORT:-4400}
  FILE_UPLOAD_BUCKET: patient-bucket
  FACILITY_S3_BUCKET: facility-bucket
  SNS_ACCESS_KEY: unused
  SNS_SECRET_KEY: unused
  EMAIL_HOST: unused
  EMAIL_USER: unused
  EMAIL_PASSWORD: unused
  # The plugs Django loads. The api build installs them from ADDITIONAL_PLUGS in its build args.
  ADDITIONAL_PLUGS: '[{"name":"abdm","package_name":"abdm","version":""}]'
  ABDM_CLIENT_ID: ${ABDM_CLIENT_ID:?Set ABDM_CLIENT_ID to your ABDM sandbox client ID}
  ABDM_CLIENT_SECRET: ${ABDM_CLIENT_SECRET:?Set ABDM_CLIENT_SECRET to your ABDM sandbox client secret}
  ABDM_CALLBACK_BASE_URL: ${ABDM_CALLBACK_BASE_URL:-}

# The api image is built once by the api service; the other backend services reuse it.
x-backend: &backend
  image: care-reference-api
  pull_policy: never
  restart: unless-stopped
  environment: *care-env
  # Bind mounts, not configs: compose recreates a container when a mount's source path changes,
  # and a run from GitHub fetches each commit of this repo to its own path.
  volumes:
    - ./api/reference-entrypoint.sh:/app/reference-entrypoint.sh:ro

# care's own healthcheck, with room for a first run's migrations before failures count.
x-slow-start: &slow-start
  test: ["CMD", "./healthcheck.sh"]
  interval: 10s
  start_period: 20m
  retries: 6

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: care
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30

  # MinIO's images are gone from Docker Hub. Silo is the MinIO fork that care's own compose
  # file uses, and its image also carries mc for the buckets service.
  minio:
    image: pgsty/silo:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      retries: 30

  buckets:
    image: pgsty/silo:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/patient-bucket local/facility-bucket &&
        mc anonymous set public local/facility-bucket
    depends_on:
      minio:
        condition: service_healthy

  celery-beat:
    <<: *backend
    # Runs migrations and syncs permissions and valuesets before it reports healthy.
    entrypoint: ["bash", "celery_beat.sh"]
    healthcheck: *slow-start
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    <<: *backend
    entrypoint: ["bash", "reference-entrypoint.sh", "celery_worker.sh"]
    depends_on: &after-migrations
      celery-beat:
        condition: service_healthy
      tunnel:
        condition: service_started
        required: false

  api:
    <<: *backend
    build:
      # care's own production Dockerfile, run on the latest develop. It pip installs the plugs in
      context: https://github.com/ohcnetwork/care.git#develop
      dockerfile: docker/prod.Dockerfile
      pull: true
      args:
        ADDITIONAL_PLUGS: '[{"name":"abdm","package_name":"git+https://github.com/ohcnetwork/care-abdm.git@main#subdirectory=backend","version":""}]'
    pull_policy: build
    entrypoint: ["bash", "reference-entrypoint.sh", "start.sh"]
    healthcheck: *slow-start
    depends_on: *after-migrations

  setup:
    <<: *backend
    restart: "no"
    # The image's healthcheck is for long-running services; this one exits when done.
    healthcheck:
      disable: true
    environment:
      <<: *care-env
      REFERENCE_URL: http://localhost:${REFERENCE_PORT:-4400}
    # care's demo data loader needs Faker, a dev dependency its production image leaves out.
    entrypoint:
      - bash
      - -c
      - ./wait_for_db.sh && pip install --quiet --no-cache-dir Faker && python manage.py shell < reference_setup.py
    volumes:
      - ./api/reference_setup.py:/app/reference_setup.py:ro
    depends_on:
      celery-beat:
        condition: service_healthy
      buckets:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      pull: true
      args:
        CARE_API_URL: http://localhost:${REFERENCE_PORT:-4400}
        # Keep in step with care-abdm's commit in the api build.
        CARE_ABDM_REF: main
    restart: unless-stopped
    ports:
      - "${REFERENCE_PORT:-4400}:80"
    depends_on:
      api:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  # Milestone M2: a public HTTPS tunnel for ABDM callbacks. It reaches only /api/abdm/ (see web/nginx.conf).
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [m2]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://web:8080

volumes:
  postgres-data:
  minio-data:
